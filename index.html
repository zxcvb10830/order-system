<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點餐系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBbdNOkiHgZPr8Rvp1GWa-mQyrjmYhQtoc",
    authDomain: "ordering-online-59bc9.firebaseapp.com",
    projectId: "ordering-online-59bc9",
    storageBucket: "ordering-online-59bc9.firebasestorage.app",
    messagingSenderId: "183105769152",
    appId: "1:183105769152:web:edc109bbc8cd110846e725"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, "orders", "current");

  window.db = db;
  window.docRef = docRef;
  window.getDoc = getDoc;
  window.setDoc = setDoc;

  async function loadData() {
    try {
      const snap = await getDoc(docRef);
      if (snap.exists()) {
        const data = snap.data();
        window.foods = data.foods || [];
        window.drinks = data.drinks || [];
        window.quickMenu = data.quickMenu || [];
        window.members = data.members || ["小明", "小華"];
      }
      [...(window.foods||[]), ...(window.drinks||[])].forEach(item => {
        if (!item.people) item.people = [];
        if (item.manual !== true) {
          item.qty = item.people.length;
        }
      });
      if (window.renderAll) window.renderAll();
      document.getElementById("syncStatus").textContent = "已載入 " + new Date().toLocaleTimeString();
    } catch(e) {
      console.error(e);
      document.getElementById("syncStatus").textContent = "載入失敗";
    }
  }

  window.loadData = loadData;
  loadData();

  onSnapshot(docRef, (snap) => {
    if (snap.exists() && !window.isSaving) {
      const data = snap.data();
      window.foods = data.foods || [];
      window.drinks = data.drinks || [];
      window.quickMenu = data.quickMenu || [];
      window.members = data.members || ["小明", "小華"];
      [...window.foods, ...window.drinks].forEach(item => {
        if (!item.people) item.people = [];
        if (item.manual !== true) {
          item.qty = item.people.length;
        }
      });
      if (window.renderAll) window.renderAll();
    }
  });
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  body {
    font-family: 'SF Pro Display', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    border: 1px solid #e5e5ea;
  }
  .btn {
    border-radius: 980px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .btn:active { transform: scale(0.97); }
  .item-card {
    background: #ffffff;
    border: 1px solid #e5e5ea;
    border-radius: 16px;
    transition: all 0.2s;
  }
  .item-card.drag-over {
    border-color: #0071e3;
    background: #f0f7ff;
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }
  .name-chip {
    background: #1d1d1f;
    border: none;
    border-radius: 980px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
    cursor: grab;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 4px;
    transition: all 0.15s;
  }
  .name-chip:hover { background: #333336; }
  .name-chip:active { cursor: grabbing; }
  .person-line {
    background: #f5f5f7;
    border-radius: 12px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13px;
  }
  .opt input { accent-color: #0071e3; margin-right: 4px; }
  .edit-qty { display: none; }
  .edit-qty.active { display: flex; }
</style>
</head>
<body class="min-h-screen">
  <div class="w-full max-w-none px-4 md:px-8 py-6">
    <header class="card p-6 md:p-8 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-4xl md:text-5xl font-semibold tracking-tight">點餐系統</h1>
          <p class="text-sm text-gray-500 mt-2">拖曳人員綁定 · 數量自動計算</p>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="loadData()" class="btn bg-[#0071e3] text-white px-5 py-2 text-sm">重新載入</button>
          <span id="syncStatus" class="text-xs text-gray-500">連線中...</span>
        </div>
      </div>
      <div id="statusSummary" class="mt-5 text-sm text-gray-600">目前還沒人點</div>
    </header>

    <div class="card p-6 md:p-8 mb-6">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-2xl font-semibold">快速點餐</h2>
        <span class="text-xs text-gray-400">食物綠 · 飲料藍</span>
      </div>
      <div id="quickMenu" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-6"></div>
      <div class="border-t border-gray-100 pt-5 grid grid-cols-1 sm:grid-cols-5 gap-3">
        <input id="newMenuName" type="text" placeholder="品項名稱" class="sm:col-span-2 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#0071e3]">
        <input id="newMenuPrice" type="number" placeholder="價格" class="border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#0071e3]">
        <select id="newMenuType" class="border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#0071e3]">
          <option value="food">食物</option>
          <option value="drink">飲料</option>
        </select>
        <button onclick="addQuickMenu()" class="btn bg-[#1d1d1f] text-white py-3 text-sm sm:col-span-1">加入</button>
      </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
      <div class="card p-6 md:p-8">
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-2xl font-semibold">食物</h2>
          <button onclick="addItem('food')" class="btn bg-emerald-500 text-white px-4 py-2 text-sm">+ 新增</button>
        </div>
        <div id="foodList" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>

      <div class="card p-6 md:p-8">
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-2xl font-semibold">飲料</h2>
          <button onclick="addItem('drink')" class="btn bg-sky-500 text-white px-4 py-2 text-sm">+ 新增</button>
        </div>
        <div id="drinkList" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>
    </div>

    <div class="card p-6 md:p-8 mb-6">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-2xl font-semibold">人員</h3>
        <div class="flex gap-2">
          <input id="newMember" type="text" placeholder="新增人名" class="w-36 border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-[#0071e3]">
          <button onclick="addMember()" class="btn bg-[#1d1d1f] text-white px-4 py-2 text-sm">+</button>
        </div>
      </div>
      <div id="membersList" class="min-h-[50px]"></div>
      <p class="text-xs text-gray-400 mt-3">拖曳到商品上綁定（同一人最多4次）· 雙擊可刪除</p>
    </div>

    <div class="card p-8 text-center">
      <div class="text-sm text-gray-500 mb-1">總金額</div>
      <div id="totalAmount" class="text-6xl font-semibold tracking-tight my-2">$0</div>
      <button onclick="clearAll()" class="btn bg-red-500 text-white px-8 py-3 text-sm mt-4">清空全部</button>
    </div>
  </div>

<script>
const ICE_OPTS = ['微冰','少冰','正常','熱'];
const SUGAR_OPTS = ['無糖','微糖','半糖'];

window.foods = [];
window.drinks = [];
window.quickMenu = [];
window.members = ['小明','小華'];
window.isSaving = false;
window.editing = {};

async function saveToFirebase() {
  if (window.isSaving || !window.setDoc || !window.docRef) return;
  window.isSaving = true;
  try {
    await window.setDoc(window.docRef, {
      foods: window.foods,
      drinks: window.drinks,
      quickMenu: window.quickMenu,
      members: window.members
    });
    document.getElementById('syncStatus').textContent = '已儲存 ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error(e);
    document.getElementById('syncStatus').textContent = '儲存失敗：' + e.message;
  } finally {
    window.isSaving = false;
  }
}

function calculateTotal() {
  let t = 0;
  [...window.foods, ...window.drinks].forEach(i => {
    const qty = i.qty || (i.people || []).length;
    t += qty * (i.price || 0);
  });
  document.getElementById('totalAmount').textContent = '$' + t;
}

function updateStatus() {
  const all = [...window.foods, ...window.drinks].filter(i => i.name && ((i.qty||0) > 0 || (i.people||[]).length > 0));
  document.getElementById('statusSummary').textContent = all.length
    ? all.map(i => `${i.name} x${i.qty || (i.people||[]).length}`).join(' · ')
    : '目前還沒人點';
  calculateTotal();
}

function getNameCount(people, name) {
  return people.filter(p => (typeof p === 'string' ? p : p.name) === name).length;
}

function renderItem(item, type, index, container) {
  const card = document.createElement('div');
  card.className = 'item-card p-5';
  const key = type + '-' + index;
  card.ondragover = e => { e.preventDefault(); card.classList.add('drag-over'); };
  card.ondragleave = () => card.classList.remove('drag-over');
  card.ondrop = e => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const name = e.dataTransfer.getData('text/plain');
    if (!name) return;
    const list = type === 'food' ? window.foods : window.drinks;
    if (!list[index].people) list[index].people = [];
    const count = getNameCount(list[index].people, name);
    if (count >= 4) {
      alert('你他媽不怕撐死阿?');
      return;
    }
    if (type === 'drink') {
      list[index].people.push({ name, ice: [], sugar: [] });
    } else {
      list[index].people.push(name);
    }
    if (list[index].manual !== true) {
      list[index].qty = list[index].people.length;
    }
    saveToFirebase();
    renderAll();
  };

  const people = item.people || [];
  const qty = item.qty !== undefined ? item.qty : people.length;
  let peopleHtml = '';
  if (type === 'drink' && people.length) {
    peopleHtml = people.map((p, pi) => `
      <div class="person-line">
        <div class="flex justify-between items-center mb-1">
          <strong>${p.name}</strong>
          <button onclick="removePerson('${type}',${index},${pi})" class="text-red-500 text-xs px-1">✕</button>
        </div>
        <div class="text-xs">冰：${ICE_OPTS.map(o => `<label class="opt mr-2"><input type="checkbox" ${(p.ice||[]).includes(o)?'checked':''} onchange="toggleOpt(${index},${pi},'ice','${o}')">${o}</label>`).join('')}</div>
        <div class="text-xs mt-1">糖：${SUGAR_OPTS.map(o => `<label class="opt mr-2"><input type="checkbox" ${(p.sugar||[]).includes(o)?'checked':''} onchange="toggleOpt(${index},${pi},'sugar','${o}')">${o}</label>`).join('')}</div>
      </div>`).join('');
  } else if (people.length) {
    peopleHtml = people.map((p, pi) => `<span class="inline-flex items-center gap-1 bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full mr-2 mb-1">${typeof p==='string'?p:p.name} <button onclick="removePerson('${type}',${index},${pi})" class="text-red-500 ml-1">×</button></span>`).join('');
  } else {
    peopleHtml = '<div class="text-gray-400 text-xs mt-2">拖曳人員到這裡</div>';
  }

  const isEditing = window.editing[key];

  card.innerHTML = `
    <div class="flex justify-between items-start gap-3">
      <div class="flex-1">
        <input type="text" value="${item.name||''}" placeholder="品項名稱" onchange="updateField('${type}',${index},'name',this.value)" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-base font-medium mb-2 focus:outline-none focus:border-[#0071e3]">
        <div class="flex items-center gap-4 text-sm text-gray-600 mb-1">
          <span>單價 <input type="number" value="${item.price||0}" min="0" onchange="updateField('${type}',${index},'price',parseInt(this.value)||0)" class="w-16 border border-gray-200 rounded-lg px-2 py-1"></span>
          <span class="font-medium text-gray-800">數量 ${qty}${item.manual ? ' (已鎖定)' : ''}</span>
        </div>
        <div class="edit-qty ${isEditing ? 'active' : ''} items-center gap-2 mt-2">
          <input type="number" id="edit-qty-${key}" value="${qty}" min="0" class="w-20 border border-gray-200 rounded-lg px-2 py-1 text-sm">
          <button onclick="saveQty('${type}',${index})" class="btn bg-[#0071e3] text-white px-4 py-1 text-xs">儲存</button>
          <button onclick="cancelEdit('${key}')" class="text-xs text-gray-500">取消</button>
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <button onclick="removeItem('${type}',${index})" class="text-red-500 text-xs px-2">刪除</button>
        <button onclick="startEdit('${key}')" class="text-[#0071e3] text-xs px-2">編輯</button>
      </div>
    </div>
    <div class="mt-3">${peopleHtml}</div>
  `;
  container.appendChild(card);
}

function startEdit(key) {
  window.editing[key] = true;
  renderAll();
}

function cancelEdit(key) {
  delete window.editing[key];
  renderAll();
}

function saveQty(type, index) {
  const key = type + '-' + index;
  const input = document.getElementById('edit-qty-' + key);
  const list = type === 'food' ? window.foods : window.drinks;
  const min = list[index].people.length;
  let val = parseInt(input.value);
  if (isNaN(val) || val < min) {
    alert('數量不能小於已綁定的人數（' + min + '）');
    val = min;
  }
  list[index].qty = val;
  list[index].manual = true;
  delete window.editing[key];
  saveToFirebase();
  renderAll();
}

function renderAll() {
  const fl = document.getElementById('foodList');
  const dl = document.getElementById('drinkList');
  fl.innerHTML = '';
  dl.innerHTML = '';
  (window.foods||[]).forEach((item,i) => renderItem(item, 'food', i, fl));
  (window.drinks||[]).forEach((item,i) => renderItem(item, 'drink', i, dl));

  const qm = document.getElementById('quickMenu');
  qm.innerHTML = '';
  (window.quickMenu||[]).forEach((item,i) => {
    const bg = item.type === 'drink' ? 'bg-sky-500' : 'bg-emerald-500';
    const wrap = document.createElement('div');
    wrap.className = 'relative';
    wrap.innerHTML = `
      <button class="btn ${bg} text-white w-full py-4 text-base font-medium" onclick="addFromMenu(${i})">${item.name}<div class="text-xs opacity-90 mt-1">$${item.price}</div></button>
      <button onclick="removeQuick(${i})" class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-none flex items-center justify-center">×</button>
    `;
    qm.appendChild(wrap);
  });

  const ml = document.getElementById('membersList');
  ml.innerHTML = '';
  (window.members||[]).forEach((name,i) => {
    const chip = document.createElement('div');
    chip.className = 'name-chip';
    chip.draggable = true;
    chip.innerHTML = `${name} <span class="text-gray-300 text-xs" onclick="event.stopPropagation(); editMember(${i})">✎</span>`;
    chip.ondragstart = e => { e.dataTransfer.setData('text/plain', name); chip.style.opacity = '0.6'; };
    chip.ondragend = () => chip.style.opacity = '1';
    chip.ondblclick = () => {
      if (confirm(`刪除 ${name}？`)) {
        window.members.splice(i, 1);
        saveToFirebase();
        renderAll();
      }
    };
    ml.appendChild(chip);
  });
  updateStatus();
}
window.renderAll = renderAll;

function editMember(i) {
  const newName = prompt('編輯人名', window.members[i]);
  if (newName && newName.trim() && !window.members.includes(newName.trim())) {
    window.members[i] = newName.trim();
    saveToFirebase();
    renderAll();
  }
}

function updateField(type, index, field, value) {
  const list = type === 'food' ? window.foods : window.drinks;
  list[index][field] = value;
  saveToFirebase();
  updateStatus();
}

function toggleOpt(index, pIndex, cat, opt) {
  const p = window.drinks[index].people[pIndex];
  if (!p[cat]) p[cat] = [];
  const i = p[cat].indexOf(opt);
  if (i >= 0) p[cat].splice(i,1); else p[cat].push(opt);
  saveToFirebase();
}

function removePerson(type, itemIndex, personIndex) {
  const list = type === 'food' ? window.foods : window.drinks;
  list[itemIndex].people.splice(personIndex, 1);
  if (list[itemIndex].manual !== true) {
    list[itemIndex].qty = list[itemIndex].people.length;
  }
  saveToFirebase();
  renderAll();
}

function addItem(type, name='', price=0) {
  const item = { name, price, qty: 0, people: [], manual: false };
  (type === 'food' ? window.foods : window.drinks).push(item);
  saveToFirebase();
  renderAll();
}

function removeItem(type, index) {
  (type === 'food' ? window.foods : window.drinks).splice(index, 1);
  saveToFirebase();
  renderAll();
}

function addFromMenu(idx) {
  const m = window.quickMenu[idx];
  addItem(m.type, m.name, m.price);
}

function addQuickMenu() {
  const name = document.getElementById('newMenuName').value.trim();
  const price = parseInt(document.getElementById('newMenuPrice').value)||0;
  const type = document.getElementById('newMenuType').value;
  if (!name) return;
  if (!window.quickMenu) window.quickMenu = [];
  window.quickMenu.push({name, price, type});
  document.getElementById('newMenuName').value = '';
  document.getElementById('newMenuPrice').value = '';
  saveToFirebase();
  renderAll();
}

function removeQuick(i) {
  window.quickMenu.splice(i,1);
  saveToFirebase();
  renderAll();
}

function addMember() {
  const name = document.getElementById('newMember').value.trim();
  if (!name || window.members.includes(name)) return;
  window.members.push(name);
  document.getElementById('newMember').value = '';
  saveToFirebase();
  renderAll();
}

function clearAll() {
  if (confirm('確定清空全部？')) {
    window.foods = [];
    window.drinks = [];
    saveToFirebase();
    renderAll();
  }
}
</script>
</body>
</html>
