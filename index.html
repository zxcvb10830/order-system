<script>
const BIN_ID = 'dQO-AcClixZAByGeTrbfs';
const WRITE_KEY = 'kj_w_e-MYRs8alILUk1G0qkmqLHOedWdv27bCvLWAULspVqg';
const API_BASE = 'https://keepjson.fourlegs.workers.dev/bins';

const ICE_OPTS = ['微冰','少冰','正常','熱'];
const SUGAR_OPTS = ['無糖','微糖','半糖'];

let foods = [];
let drinks = [];
let quickMenu = [];
let members = ['小明','小華'];
let isSaving = false;

async function loadFromServer() {
  try {
    document.getElementById('syncStatus').textContent = '更新中...';
    const res = await fetch(`${API_BASE}/${BIN_ID}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    foods = data.foods || [];
    drinks = data.drinks || [];
    quickMenu = data.quickMenu || [];
    members = data.members || members;
    
    // 確保每樣商品的 qty 與 people 數量同步
    [...foods, ...drinks].forEach(item => {
      if (!item.people) item.people = [];
      item.qty = item.people.length; // 未綁定為0，綁幾個人就自動+1
    });

    renderAll();
    document.getElementById('syncStatus').textContent = '已更新 ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('syncStatus').textContent = '更新失敗';
  }
}

async function saveToServer() {
  if (isSaving) return;
  isSaving = true;
  try {
    await fetch(`${API_BASE}/${BIN_ID}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${WRITE_KEY}`},
      body:JSON.stringify({foods, drinks, quickMenu, members})
    });
    document.getElementById('syncStatus').textContent = '已儲存 ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('syncStatus').textContent = '儲存失敗';
  } finally { isSaving = false; }
}

function calculateTotal() {
  let t = 0;
  [...foods,...drinks].forEach(i => {
    i.qty = (i.people || []).length; // 強制以綁定人數計算總額
    t += (i.qty)*(i.price||0);
  });
  document.getElementById('totalAmount').textContent = `$${t}`;
  return t;
}

function updateStatus() {
  const all = [...foods,...drinks].filter(i=>i.name && (i.people||[]).length > 0);
  const el = document.getElementById('statusSummary');
  el.textContent = all.length ? all.map(i => {
    const names = (i.people||[]).map(p => typeof p==='string'?p:p.name).join(',') || '未綁';
    return `${i.name} x${i.qty} (${names})`;
  }).join(' | ') : '目前還沒人點';
  calculateTotal();
}

function renderItem(item, type, index, container) {
  const card = document.createElement('div');
  card.className = 'item-card p-2';
  card.ondragover = e => { e.preventDefault(); card.classList.add('drag-over'); };
  card.ondragleave = () => card.classList.remove('drag-over');
  card.ondrop = e => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const name = e.dataTransfer.getData('text/plain');
    if (!name) return;
    const list = type==='food'?foods:drinks;
    if (!list[index].people) list[index].people = [];
    const exists = list[index].people.some(p => (typeof p==='string'?p:p.name) === name);
    if (!exists) {
      if (type === 'drink') {
        list[index].people.push({name, ice:['正常'], sugar:['正常']});
      } else {
        list[index].people.push(name);
      }
      list[index].qty = list[index].people.length; // 自動 +1
      saveToServer();
      renderAll();
    }
  };

  let peopleHtml = '';
  if (type === 'drink' && item.people && item.people.length) {
    peopleHtml = item.people.map((p, pi) => {
      const iceChecks = ICE_OPTS.map(o => `<label class="opt-label"><input type="checkbox" ${p.ice.includes(o)?'checked':''} onchange="toggleOpt('drink',${index},${pi},'ice','${o}')">${o}</label>`).join('');
      const sugarChecks = SUGAR_OPTS.map(o => `<label class="opt-label"><input type="checkbox" ${p.sugar.includes(o)?'checked':''} onchange="toggleOpt('drink',${index},${pi},'sugar','${o}')">${o}</label>`).join('');
      return `<div class="person-row flex justify-between items-center">
        <div>
          <strong>${p.name}</strong>
          <div>冰：${iceChecks}</div>
          <div>糖：${sugarChecks}</div>
        </div>
        <button onclick="removePersonFromItem('${type}', ${index}, ${pi})" class="text-red-500 font-bold ml-2 px-1">✕</button>
      </div>`;
    }).join('');
  } else if (item.people && item.people.length) {
    peopleHtml = item.people.map((p, pi) => {
      const pName = typeof p==='string'?p:p.name;
      return `<span class="bound-tag inline-flex items-center gap-1 bg-white px-2 py-0.5 rounded border border-amber-200 mr-1 mb-1 text-xs">
        ${pName}
        <button onclick="removePersonFromItem('${type}', ${index}, ${pi})" class="text-red-500 font-bold">×</button>
      </span>`;
    }).join(' ');
  } else {
    peopleHtml = '<span class="text-gray-400 text-xs">拖曳人員到這裡 (數量: 0)</span>';
  }

  card.innerHTML = `
    <div class="flex gap-1 items-start">
      <div class="flex-1">
        <input type="text" value="${item.name||''}" placeholder="品項" onchange="updateField('${type}',${index},'name',this.value)" class="w-full px-1 py-0.5 text-sm font-bold mb-1 border rounded">
        <div class="flex gap-2 items-center text-xs text-amber-900">
          <span>單價: $<input type="number" value="${item.price||0}" min="0" onchange="updateField('${type}',${index},'price',parseInt(this.value)||0)" class="w-14 px-1 py-0.5 border rounded"></span>
          <span class="font-bold text-orange-600">數量: ${item.people ? item.people.length : 0}</span>
        </div>
      </div>
      <button onclick="removeItem('${type}',${index})" class="text-red-600 text-xs">刪除品項</button>
    </div>
    <div class="mt-1">${peopleHtml}</div>
  `;
  container.appendChild(card);
}

// 移除綁定人員並自動 -1
function removePersonFromItem(type, itemIndex, personIndex) {
  const list = type === 'food' ? foods : drinks;
  list[itemIndex].people.splice(personIndex, 1);
  list[itemIndex].qty = list[itemIndex].people.length;
  saveToServer();
  renderAll();
}

function renderList(list, id, type) {
  const c = document.getElementById(id);
  c.innerHTML = '';
  list.forEach((item,i) => renderItem(item, type, i, c));
}

function renderQuickMenu() {
  const c = document.getElementById('quickMenu');
  c.innerHTML = '';
  quickMenu.forEach((item,i) => {
    const color = item.type === 'drink' ? 'ms-btn-blue' : 'ms-btn-green';
    const wrap = document.createElement('div');
    wrap.className = 'relative';
    wrap.innerHTML = `
      <button class="ms-btn ${color} w-full py-1.5 text-xs font-bold" onclick="addFromMenu(${i})">${item.name} $${item.price}</button>
      <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center cursor-pointer" onclick="removeQuick(${i})">×</span>
    `;
    c.appendChild(wrap);
  });
}

function renderMembers() {
  const c = document.getElementById('membersList');
  c.innerHTML = '';
  members.forEach((name,i) => {
    const b = document.createElement('div');
    b.className = 'name-block';
    b.draggable = true;
    b.textContent = name;
    b.ondragstart = e => { e.dataTransfer.setData('text/plain', name); b.style.opacity='0.5'; };
    b.ondragend = () => b.style.opacity='1';
    b.ondblclick = () => { if(confirm(`刪除 ${name}?`)) { members.splice(i,1); saveToServer(); renderMembers(); } };
    c.appendChild(b);
  });
}

function renderAll() {
  renderList(foods,'foodList','food');
  renderList(drinks,'drinkList','drink');
  renderQuickMenu();
  renderMembers();
  updateStatus();
}

function updateField(type, index, field, value) {
  const list = type==='food'?foods:drinks;
  list[index][field] = value;
  saveToServer();
  updateStatus();
}

function toggleOpt(type, index, pIndex, cat, opt) {
  const list = drinks;
  const p = list[index].people[pIndex];
  if (!p[cat]) p[cat] = [];
  const idx = p[cat].indexOf(opt);
  if (idx >= 0) p[cat].splice(idx,1);
  else p[cat].push(opt);
  saveToServer();
}

function addItem(type, name='', price=0) {
  const item = { name, price, qty: 0, people: [] };
  (type==='food'?foods:drinks).push(item);
  saveToServer();
  renderAll();
}

function removeItem(type, index) {
  (type==='food'?foods:drinks).splice(index,1);
  saveToServer();
  renderAll();
}

function addFromMenu(idx) {
  // 點擊快速選單時，預設新增一個品項並帶入價格
  const m = quickMenu[idx];
  addItem(m.type, m.name, m.price);
}

function addQuickMenu() {
  const name = document.getElementById('newMenuName').value.trim();
  const price = parseInt(document.getElementById('newMenuPrice').value)||0;
  const type = document.getElementById('newMenuType`').value;
  if (!name) return;
  quickMenu.push({name, price, type});
  document.getElementById('newMenuName').value='';
  document.getElementById('newMenuPrice').value='';
  saveToServer();
  renderQuickMenu();
}

function removeQuick(i) {
  quickMenu.splice(i,1);
  saveToServer();
  renderQuickMenu();
}

function addMember() {
  const name = document.getElementById('newMember').value.Rtrim ? document.getElementById('newMember').value.trim() : document.getElementById('newMember').value.trim();
  if (!name || members.includes(name)) return;
  members.push(name);
  document.getElementById('newMember').value='';
  saveToServer();
  renderMembers();
}

function clearAll() {
  if (confirm('確定清空所有品項與點餐紀錄？')) {
    foods=[]; drinks=[];
    saveToServer();
    renderAll();
  }
}

// 每 3 秒自動輪詢雲端，讓大家的手機保持即時同步
setInterval(loadFromServer, 3000);
loadFromServer();
</script>
